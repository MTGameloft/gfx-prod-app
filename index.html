<!DOCTYPE html>
<html lang="en" data-theme="default" data-density="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>GFX Prod App</title>
<link rel="icon" href="assets/favicon.svg">
<link rel="stylesheet" href="css/app.css">
<!-- Teams JS SDK. Absent when the page is opened outside Teams (or offline);
     teams.js detects that and runs the app in standalone mode. -->
<script src="https://res.cdn.office.net/teams-js/2.24.0/js/MicrosoftTeams.min.js"
        crossorigin="anonymous" onerror="window.__noTeamsSdk=true"></script>
</head>
<body>

<div id="splash"><div style="text-align:center">
  <div class="spin" style="margin:0 auto 12px"></div>
  <div class="tiny mute">Loading GFX Prod App…</div>
</div></div>

<div id="shell" hidden>

  <aside id="rail">
    <div class="brand">
      <div class="brand-mark" id="brandMark">GFX</div>
      <div class="brand-text">
        <b>GFX Prod App</b>
        <span id="brandSub">Art Production Console</span>
      </div>
    </div>
    <nav id="nav"></nav>
    <div class="rail-foot">
      <div class="who" id="whoBtn" title="Profile &amp; settings">
        <div class="avatar" id="whoAv">?</div>
        <div class="who-txt">
          <b id="whoName">Sign in</b>
          <span id="whoRole">—</span>
        </div>
      </div>
    </div>
  </aside>

  <div id="main">
    <header id="top">
      <button class="btn icon subtle" id="railToggle" title="Collapse sidebar (Ctrl+B)">
        <svg class="ico"><use href="#i-menu"></use></svg>
      </button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <div class="crumb" id="pageCrumb"></div>
      </div>
      <div class="spacer"></div>
      <div id="topActions" class="row"></div>
      <button class="btn icon subtle" id="cmdBtn" title="Quick search (Ctrl+K)">
        <svg class="ico"><use href="#i-search"></use></svg>
      </button>
      <button class="btn icon subtle" id="themeBtn" title="Toggle theme">
        <svg class="ico"><use href="#i-theme"></use></svg>
      </button>
    </header>
    <main id="view"></main>
  </div>

</div>

<div id="toasts"></div>

<!-- ------------------------------------------------------------------ -->
